rvm: true
before_script:
  - cd spec/dummy && bundle exec rake db:schema:load RAILS_ENV=test
builds:
  # Every lane runs the same whole-repository suite, so lane-specific paths
  # cannot isolate individual builds. Documentation-only changes are the only
  # safe common exclusion; peak_flow.yml and shared/root changes run all lanes.
  build_1:
    paths:
      - "**"
      - "!**/*.md"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_2.gemfile
      RUBY_VERSION: 2.7.8
    name: Ruby 2.7.8
    script:
      - bundle exec appraisal "ruby 2" rspec
  build_2:
    paths:
      - "**"
      - "!**/*.md"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3.gemfile
      RUBY_VERSION: 3.0.4
    name: Ruby 3.0.4
    script:
      - bundle exec appraisal "ruby 3" rspec
  build_3:
    paths:
      - "**"
      - "!**/*.md"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3.gemfile
      RUBY_VERSION: 3.1.2
    name: Ruby 3.1.2
    script:
      - bundle exec appraisal "ruby 3" rspec
  build_4:
    paths:
      - "**"
      - "!**/*.md"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3.gemfile
      RUBY_VERSION: 3.2.2
    name: Ruby 3.2.2
    script:
      - bundle exec appraisal "ruby 3" rspec
  build_5:
    paths:
      - "**"
      - "!**/*.md"
    environment:
      BUNDLE_GEMFILE: /home/build/project/gemfiles/ruby_3.gemfile
      RUBY_VERSION: 3.2.2
    name: Linters
    script:
      - bundle exec appraisal "ruby 3" rake best_practice_project:run
